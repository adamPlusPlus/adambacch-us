<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="robots" content="noindex">
 <noscript><meta http-equiv="refresh" content="0; url=https://github.com/adamPlusPlus"></noscript>
 <title>Opening GitHub…</title>
 <script src="/m.js"></script>
</head>
<body>
 <p><a href="https://github.com/adamPlusPlus">Continue to GitHub</a></p>
 <script>
  // m.js logs the view (path /go/github/, plus any ?src=); leaving the page flushes it.
  if (window.bm) window.bm("out", "github.com");
  setTimeout(function () { location.replace("https://github.com/adamPlusPlus"); }, 150);
 </script>
</body>
</html>
